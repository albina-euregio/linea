stages:
  - build
  - deploy

.build:
  image: node:26.10.0
  stage: build
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - command -v pnpm || npm install --global pnpm@12.9.1
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

build:wasm:
  image: rust:1.99.0-slim
  stage: build
  cache:
    key:
      files:
        - wasm/smet/Cargo.lock
    paths:
      - wasm/smet/target
  script:
    - rustup target add wasm32-unknown-unknown
    - cargo test --manifest-path wasm/smet/Cargo.toml
    - cargo build --release --target wasm32-unknown-unknown --manifest-path wasm/smet/Cargo.toml
    - cp wasm/smet/target/wasm32-unknown-unknown/release/smet.wasm src/data/smet.wasm
  artifacts:
    paths:
      - src/data/smet.wasm

build:
  extends: .build
  needs:
    - build:wasm
  script:
    - pnpm run ci
    - VITE_LINEA_WASM=0 pnpm run test
    - pnpm pack
  artifacts:
    paths:
      - demo.html
      - dist/
      - albina-euregio-linea*tgz
      - LICENSE
      - package.json
      - README.md

build:cli:
  extends: .build
  script:
    - pnpm run build:cli
  artifacts:
    name: ${CI_PROJECT_NAME}-${CI_JOB_NAME_SLUG}-${CI_COMMIT_SHORT_SHA}
    paths:
      - dist/
      - LICENSE
      - package.json
      - README.md

osv-scanner:
  stage: build
  image:
    name: ghcr.io/google/osv-scanner:latest
    entrypoint: [""]
  allow_failure: true
  script:
    - /osv-scanner --version
    - /osv-scanner scan source --recursive .

publish-npm:
  extends: .build
  stage: deploy
  needs:
    - build
  script:
    - npm config set -- "@${CI_PROJECT_ROOT_NAMESPACE}:registry=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
    - npm config set -- "${CI_API_V4_URL#https?}/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=\${CI_JOB_TOKEN}"
    - npm config set -- "${CI_API_V4_URL#https?}/groups/${CI_PROJECT_ROOT_NAMESPACE}/-/packages/npm/:_authToken=\${CI_JOB_TOKEN}"
    - npm version --no-git-tag-version $CI_COMMIT_TAG
    - npm publish
  only:
    - tags

pages:
  stage: deploy
  image: alpine:latest
  needs:
    - build
  pages:
    publish: dist
  script:
    - echo Deploying GitLab Pages
  only:
    - tags

# https://docs.gitlab.com/ci/jobs/ssh_keys/
# Per environment, set the CI/CD variables:
#   SSH_PRIVATE_KEY (file), SSH_KNOWN_HOSTS (file, from `ssh-keyscan` on a trusted network),
#   SFTP_SERVER (e.g. linea@example.com:/opt/linea/)
.deploy:cli:
  stage: deploy
  image: alpine:latest
  needs:
    - build:cli
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - chmod 400 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
  script:
    - rsync -e 'ssh -p2201' --compress --delete --recursive --verbose dist LICENSE package.json README.md $SFTP_SERVER

deploy:cli:dev:
  extends: .deploy:cli
  environment:
    name: dev
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: true

deploy:cli:prod:
  extends: .deploy:cli
  environment:
    name: prod
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
