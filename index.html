<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>linea</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell,
          "Fira Sans", "Droid Sans", "Helvetica Neue", Arial, sans-serif;
        color: light-dark(#565f61, CanvasText);
        margin: 20px;
        overflow-y: scroll;
      }
      nav {
        margin-bottom: 20px;
      }
      nav summary {
        cursor: pointer;
        margin-bottom: 4px;
      }
      nav .stations {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      nav button {
        padding: 4px 8px;
        background: transparent;
        color: inherit;
        border: 1px solid #b1c1c7;
        border-radius: 0;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      nav button:hover {
        border-color: #19abff;
        color: #19abff;
      }
    </style>
  </head>
  <body>
    <nav>
      <details open>
        <summary>Stations</summary>
        <div class="stations"></div>
      </details>
    </nav>
    <linea-plot
      features="[]"
      showsurfacehoarseries
      showtitle
      showexport
      showdatepicker
      forecast-latlon='["47.180105,11.288011"]'
    >
    </linea-plot>
    <script type="module" src="./src/aws-stats/main"></script>
    <script type="module" src="./src/main"></script>
    <script type="module" src="./index-nav-buttons"></script>
  </body>
</html>
